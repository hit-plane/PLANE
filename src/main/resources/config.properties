# 飞机大战 参数配置（NF-04）
# 改完这个文件重启程序就生效，不用改代码、不用重新编译。
# 某项写错、写不成数字、或者整行删掉，程序都退回用 GameConfig 里的默认值，不会崩。

# ---------- 战场与帧率 ----------
# 竖版窗口：宽 < 高。飞机大战是上下推进的玩法，竖屏留出更长的纵深。
window.width=600
window.height=900
fps=60

# ---------- 图标缩放 ----------
# 玩家机、敌机、子弹、道具的尺寸都按这个系数整体放大：1.0 = 原始尺寸，1.5 = 增大 50%。
# 贴图渲染高度与碰撞盒都乘这个系数，两边同源，不会出现"看得见却打不到"。
# 下面 player.size / enemy.*.size / item.size 填的都是 1.0 倍率下的原始尺寸。
icon.scale=1.5

# ---------- 玩家（F07 / F03 / Q6） ----------
# 玩家机边长（原始尺寸），实际尺寸 = 本值 × icon.scale。
player.size=50
player.health=100
player.speed=360
player.fire.interval=0.3
player.firepower.duration=10.0
# 火力上限：火力几级就打几发子弹，5 级即五连发。
player.firepower.max=5
# 玩家子弹伤害：1 级 = 基准伤害的 100%，等级越高弹道越多、单发越轻，防止五连发总伤害失控。
# 基准值 100 与敌机血量同一刻度（100 = 原来 1 点伤害），各档百分比都能落在整数上。
player.bullet.damage.base=100
player.bullet.damage.percent.lv1=100
player.bullet.damage.percent.lv2=75
player.bullet.damage.percent.lv3=65
player.bullet.damage.percent.lv4=50
player.bullet.damage.percent.lv5=50
player.invincible.time=1.0

# ---------- 伤害（F07 / Q2） ----------
# 这里指"敌弹/撞击打玩家"的扣血量，与上面玩家子弹的伤害刻度无关。
damage.bullet=10
damage.collision=20
damage.bomber.collision=40

# ---------- 敌机血量与分值（F08） ----------
# 填的是第 1 关的基准血量，刻度同 player.bullet.damage.base（100 = 原来 1 点伤害）：
# 普通 2 发、横移 1 发、射击 3 发、自爆 1 发即可击毁，与旧版手感一致。
# 实战血量 = 本值 × (1 + (关卡 - 1) × enemy.health.growth.per.level)。
enemy.normal.health=200
enemy.normal.score=100
enemy.moving.health=100
enemy.moving.score=150
enemy.shooting.health=300
enemy.shooting.score=200
enemy.bomber.health=100
enemy.bomber.score=150
# 血量成长：每升 1 关，血量增加 15%（第 1 关为基准，第 10 关约 2.35 倍）。
enemy.health.growth.per.level=0.15

# ---------- 敌机尺寸与速度 ----------
# 尺寸同样填原始值，实际尺寸 = 本值 × icon.scale。
enemy.normal.size=40
enemy.size=50
enemy.normal.speed=150
enemy.moving.speed=110
enemy.moving.sway.speed=130
enemy.shooting.speed=90
enemy.bomber.speed=430

# ---------- 敌机射击（F05） ----------
enemy.shooting.fire.interval=2.0
enemy.bullet.speed=260

# ---------- 关卡与难度递增（F11） ----------
level.score.per.level=1000
# 分数上限（通关分数）：累计得分打到 10000 就判通关（v1.0 是 5000）。
# 10000 正好等于"关卡上限 10 级 × 每级 1000 分"，也就是要打满 10 关才算赢。
level.victory.score=10000
# 怪密度：生成间隔越短越密。基础间隔 1.0 → 0.5 秒，同屏敌机数又翻一倍（对 v1.0 是 4 倍）；
# 每升 1 关再减 0.04 秒，下限 0.175 秒兜住高关卡，免得一帧糊满屏。
spawn.interval.base=0.5
spawn.interval.step=0.04
spawn.interval.min=0.175
spawn.normal.weight=3.0
spawn.advanced.weight.max=4.0

# ---------- 背景滚动 ----------
# 背景纵向循环滚动速度（像素/秒），模拟飞机向前飞行的视觉效果。
background.scroll.speed=40

# ---------- 道具（F10 / Q6） ----------
# 掉落概率：第 1 关击毁敌机有 50% 掉道具，关卡越高掉得越少——
# 每升 1 关减 5%，下限 15%（第 8 关起贴着下限，第 10 关即 15%）。
item.drop.rate=0.5
item.drop.rate.step=0.05
item.drop.rate.min=0.15
# 掉出来的道具里"火力强化（加弹道）"占 25%；剩下 75% 由炸弹/护盾/回血三选一均分，
# 也是各 25%——四种道具等概率，火力强化不再是最常见的一种。
item.firepower.rate=0.25
item.heal.amount=30
# 道具直径（原始尺寸），实际尺寸 = 本值 × icon.scale。
item.size=30
item.fall.speed=110
item.flash.duration=3.0

# ---------- 炸弹冲击波（F10） ----------
# 拾取炸弹后，冲击波从战场底边向上扫；扫到的敌机消失、敌弹一并清除。
# 扫速（像素/秒）：调大 = 扫得更快。
bomb.wave.speed=900
# 波带在屏幕上的高度（像素）；贴图按此高度等比缩放后横向平铺。
bomb.wave.height=128
# 扫掉的敌机按原分值的这个比例计分（0.6 = 60%）。
bomb.wave.score.rate=0.6
