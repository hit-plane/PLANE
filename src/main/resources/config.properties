# 飞机大战 参数配置（NF-04）
# 改完这个文件重启程序就生效，不用改代码、不用重新编译。
# 某项写错、写不成数字、或者整行删掉，程序都退回用 GameConfig 里的默认值，不会崩。

# ---------- 战场与帧率 ----------
# 竖版窗口：宽 < 高。飞机大战是上下推进的玩法，竖屏留出更长的纵深。
window.width=600
window.height=900
fps=60

# ---------- 图标缩放 ----------
# 玩家机、敌机、子弹、道具的尺寸都按这个系数整体放大：1.0 = 原始尺寸，1.5 = 增大 50%。
# 贴图渲染高度与碰撞盒都乘这个系数，两边同源，不会出现"看得见却打不到"。
# 下面 player.size / enemy.*.size / item.size 填的都是 1.0 倍率下的原始尺寸。
icon.scale=1.5

# ---------- 玩家（F07 / F03 / Q6） ----------
# 玩家机边长（原始尺寸），实际尺寸 = 本值 × icon.scale。
player.size=50
player.health=100
player.speed=360
player.fire.interval=0.3
# 火力上限：火力几级就打几发子弹，5 级即五连发。
# 火力强化不再有时限：吃到就永久加一条弹道，本局内不衰减，只有开新一局才回到 1 级。
player.firepower.max=5
# 玩家子弹伤害：1 级 = 基准伤害的 100%，等级越高弹道越多、单发越轻，防止五连发总伤害失控。
# 基准值 100 与敌机血量同一刻度（100 = 原来 1 点伤害），各档百分比都能落在整数上。
player.bullet.damage.base=100
player.bullet.damage.percent.lv1=100
player.bullet.damage.percent.lv2=75
player.bullet.damage.percent.lv3=65
player.bullet.damage.percent.lv4=50
player.bullet.damage.percent.lv5=50
player.invincible.time=1.0

# ---------- 伤害（F07 / Q2） ----------
# 这里指"敌弹/撞击打玩家"的扣血量，与上面玩家子弹的伤害刻度无关。
damage.bullet=10
damage.collision=20
damage.bomber.collision=40

# ---------- 敌机血量与分值（F08） ----------
# 填的是第 1 关的基准血量，刻度同 player.bullet.damage.base（100 = 原来 1 点伤害）：
# 普通 2 发、横移 1 发、射击 3 发、自爆 1 发即可击毁，与旧版手感一致。
# 实战血量 = 本值 × (1 + (关卡 - 1) × enemy.health.growth.per.level)。
enemy.normal.health=200
enemy.normal.score=100
enemy.moving.health=100
enemy.moving.score=150
enemy.shooting.health=300
enemy.shooting.score=200
enemy.bomber.health=100
enemy.bomber.score=150
# 血量成长：每升 1 关，血量增加 15%（第 1 关为基准，第 10 关约 2.35 倍）。
enemy.health.growth.per.level=0.15

# ---------- 敌机尺寸与速度 ----------
# 尺寸同样填原始值，实际尺寸 = 本值 × icon.scale。
enemy.normal.size=40
enemy.size=50
enemy.normal.speed=150
enemy.moving.speed=110
enemy.moving.sway.speed=130
enemy.shooting.speed=90
enemy.bomber.speed=430

# ---------- 敌机射击（F05） ----------
enemy.shooting.fire.interval=2.0
enemy.bullet.speed=260

# ---------- 关卡与难度递增（F11） ----------
level.score.per.level=1000
# 分数上限（通关分数）：累计得分打到 10000 就判通关（v1.0 是 5000）。
# 10000 正好等于"关卡上限 10 级 × 每级 1000 分"，也就是要打满 10 关才算赢。
level.victory.score=10000
# 怪密度：生成间隔越短越密。基础间隔 1.0 → 0.5 秒，同屏敌机数又翻一倍（对 v1.0 是 4 倍）；
# 每升 1 关再减 0.04 秒，下限 0.175 秒兜住高关卡，免得一帧糊满屏。
spawn.interval.base=0.5
spawn.interval.step=0.04
spawn.interval.min=0.175
spawn.normal.weight=3.0
spawn.advanced.weight.max=4.0

# ---------- 背景滚动 ----------
# 背景纵向循环滚动速度（像素/秒），模拟飞机向前飞行的视觉效果。
background.scroll.speed=40

# ---------- 难度（F16） ----------
# 三档难度：简单 / 普通 / 困难。上面所有基础数值都不分难度，难度只体现为这里的五个维度——
# 先按普通档算出基础值，再乘本档倍率。普通档倍率全为 1.0，即完全等于旧版，一点没动。
# 五个维度：
#   enemy.health     敌机血量倍率（越大越耐打）
#   health.growth    每关血量成长率的倍率（越大后期涨得越陡）
#   item.drop.rate   道具掉落概率倍率（越大掉得越多）
#   spawn.interval   敌机生成间隔倍率（越大出得越稀疏）
#   type.weight.mult 单机型刷新权重倍率（只改某一种机型出现的多寡，不改整体密度）
#     逐机型写法：difficulty.<档>.type.weight.mult.<机型>，机型名取 moving / shooting / bomber；
#     没单独配的机型退回本档的 difficulty.<档>.type.weight.mult（四档默认 1.0）。
#     普通机没有这一项：它的权重是固定值 spawn.normal.weight，压它等于整体变密，
#     那属于 spawn.interval 的职责。
# 另外还有三个**直接改玩家自身**的参数（不是偏移而是起点，常规三档都等于旧版数值）：
#   player.health.mult       玩家血量上限倍率（× player.health，基准 100）
#   player.start.firepower   一局的起始火力等级（仍受 player.firepower.max 封顶）
#   player.bullet.speed.mult 玩家子弹速度倍率（基线 = 窗口高度 ÷ 射击间隔，恰好一屏/发）
# 注意生成间隔的下限是**按档配置**的 difficulty.<档>.spawn.interval.min，且不乘倍率：
# 简单/普通/困难三档共用 0.175 秒（防止高关卡一帧糊满屏的安全阀），
# 折磨档单独放宽到 0.12 秒，否则它也会在后期贴到 0.175，与其它档收敛到同一密度。
#
# 简单：敌机更脆、血量涨得更慢、道具掉得更多、敌机更稀疏；机型权重与普通档一致。
#   血量 0.8 倍 → 第 1 关普通机 200→160（仍是 2 发）；每关成长 15%→10.5%，第 10 关 1.95 倍
#   掉落率 50%→70%，下限 15%→21%；生成间隔 0.5→0.6 秒
difficulty.easy.enemy.health.mult=0.8
difficulty.easy.enemy.health.growth.mult=0.7
difficulty.easy.item.drop.rate.mult=1.4
difficulty.easy.spawn.interval.mult=1.2
difficulty.easy.spawn.interval.min=0.175
difficulty.easy.type.weight.mult=1.0
difficulty.easy.player.health.mult=1.0
difficulty.easy.player.start.firepower=1
difficulty.easy.player.cheat.start.firepower=4
difficulty.easy.player.cheat.health.mult=99.99
difficulty.easy.player.cheat.bullet.speed.mult=2.0
difficulty.easy.player.cheat.bullet.damage.mult=99.99
# 普通：当前版本的数值，五个维度必须保持 1.0，改这里就等于改了整个游戏的基准手感。
difficulty.normal.enemy.health.mult=1.0
difficulty.normal.enemy.health.growth.mult=1.0
difficulty.normal.item.drop.rate.mult=1.0
difficulty.normal.spawn.interval.mult=1.0
difficulty.normal.spawn.interval.min=0.175
difficulty.normal.type.weight.mult=1.0
difficulty.normal.player.health.mult=1.0
difficulty.normal.player.start.firepower=1
difficulty.normal.player.cheat.start.firepower=4
difficulty.normal.player.cheat.health.mult=99.99
difficulty.normal.player.cheat.bullet.speed.mult=2.0
difficulty.normal.player.cheat.bullet.damage.mult=99.99
# 困难：敌机更厚、血量涨得更陡、敌机更密；补给只是略紧，会开火的射击机则明显变少。
#   血量 1.25 倍 → 第 1 关普通机 200→250（要 3 发）；每关成长 15%→22.5%，第 10 关 3.03 倍
#   掉落率 50%→40%，下限 15%→12%：仍严格低于普通档（50%/15%），但比原来的 30%/9% 宽裕
#   生成间隔 0.5→0.4 秒
difficulty.hard.enemy.health.mult=1.25
difficulty.hard.enemy.health.growth.mult=1.5
difficulty.hard.item.drop.rate.mult=0.8
difficulty.hard.spawn.interval.mult=0.8
difficulty.hard.spawn.interval.min=0.175
difficulty.hard.type.weight.mult=1.0
# 射击机（enemy3）：会朝玩家发射敌弹，高密度下最容易叠成躲不掉的弹幕，困难档压到四成。
#   第 2 关起射击机占比 1/6≈16.7% → 0.4/5.4≈7.4%；第 5 关起 1/5=20% → 0.4/4.4≈9.1%
difficulty.hard.type.weight.mult.shooting=0.4
# 自爆机（enemy4）与横移机（enemy2）在困难档保持普通档权重，需要时可照上面一行加配置。
difficulty.hard.type.weight.mult.bomber=1.0
difficulty.hard.type.weight.mult.moving=1.0
difficulty.hard.player.health.mult=1.0
difficulty.hard.player.start.firepower=1
difficulty.hard.player.cheat.start.firepower=4
difficulty.hard.player.cheat.health.mult=99.99
difficulty.hard.player.cheat.bullet.speed.mult=2.0
difficulty.hard.player.cheat.bullet.damage.mult=99.99
#
# 折磨：隐藏第四档，不在主菜单常规三档里显示——要在主菜单输入暗号 kskbl 才会出现（见 PlaneApp）。
#   定位是"开发者/挑战者模式"：敌人那边大幅加压，玩家这边同时给足底子。
#   敌机血量 2.0 倍 → 第 1 关普通机 200→400；每关成长 15%→37.5%，第 10 关约 4.4 倍
#   掉落率 50%→25%，下限 15%→7.5%
#   生成间隔 0.5→0.3 秒且下限放宽到 0.12：第 4 关起压到 0.12～0.3 秒一架，后期不再与其它档收敛
difficulty.torment.enemy.health.mult=2.0
difficulty.torment.enemy.health.growth.mult=2.5
difficulty.torment.item.drop.rate.mult=0.5
difficulty.torment.spawn.interval.mult=0.6
difficulty.torment.spawn.interval.min=0.12
# 折磨档不动机型权重：四类敌机全都照普通档的比例来，要的就是"什么都来"。
difficulty.torment.type.weight.mult=1.0
# 玩家侧：常规口径（作弊关闭时）四档都是"单发、100 血、原速、常规伤害"；下面这组 cheat.* 是
# **作弊开关打开后**才生效的加成，四档给的是同一套（难度只决定敌人多狠，作弊一开玩家底子就拉满）：
#   起始火力 1 + 4 = 5 级 = 开局五连发（player.firepower.max 的上限本身就是 5，所以直接给满）
#   血量 100 × 99.99 = 9999（不是 100 倍：100 倍正好 10000，会贴在封顶值上，等于没封）
#   弹速 2.0 倍 → 基线 3000 px/s 提到 6000 px/s，子弹在空中停留时间减半、出屏更快
#   伤害 99.99 倍 → 1 级 100 × 99.99 = 9999（一枪秒掉任何敌机；5 级 50 × 99.99 = 5000）
# 四档的 cheat.* 现在填的是同一个值；想让某档"作弊也有区别"，改对应档的这几个键即可
# （例如把 easy 的 cheat.start.firepower 调回 0，简单档开作弊就不给五连发）。
# 单发伤害的取整顺序：先按火力等级算百分比伤害，再乘倍率、最后取整（9999 才不会被吃掉）。
difficulty.torment.player.health.mult=1.0
difficulty.torment.player.start.firepower=1
difficulty.torment.player.cheat.start.firepower=4
difficulty.torment.player.cheat.health.mult=99.99
difficulty.torment.player.cheat.bullet.speed.mult=2.0
difficulty.torment.player.cheat.bullet.damage.mult=99.99

# ---------- 道具（F10 / Q6） ----------
# 掉落概率：第 1 关击毁敌机有 50% 掉道具，关卡越高掉得越少——
# 每升 1 关减 5%，下限 15%（第 8 关起贴着下限，第 10 关即 15%）。
item.drop.rate=0.5
item.drop.rate.step=0.05
item.drop.rate.min=0.15
# 掉出来的道具里"火力强化（加弹道）"占 25%；剩下 75% 由炸弹/护盾/回血三选一均分，
# 也是各 25%——四种道具等概率，火力强化不再是最常见的一种。
item.firepower.rate=0.25
item.heal.amount=30
# 道具直径（原始尺寸），实际尺寸 = 本值 × icon.scale。
item.size=30
item.fall.speed=110
item.flash.duration=3.0

# ---------- 炸弹冲击波（F10） ----------
# 拾取炸弹后，冲击波从战场底边向上扫；扫到的敌机消失、敌弹一并清除。
# 扫速（像素/秒）：调大 = 扫得更快。
bomb.wave.speed=900
# 波带在屏幕上的高度（像素）；贴图按此高度等比缩放后横向平铺。
bomb.wave.height=128
# 扫掉的敌机按原分值的这个比例计分（0.4 = 40%）。
bomb.wave.score.rate=0.4
